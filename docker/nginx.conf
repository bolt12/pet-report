# nginx for the Docker image: serves the built SPA and proxies the API.
#
# The proxy timeouts and body limit below are duplicated in two other places,
# because each generates its own nginx config: flake.nix (the Nix-built image)
# and nix/module.nix (the NixOS vhost). Change one, change all three.
#
# Workers run as root so they can write buffering temp files under /tmp (the
# directories the entrypoint creates); harmless in a single-purpose container
# that binds only the high UI port.
daemon off;
user root;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { }
http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # A pet photo posts to /api as base64, so lift nginx's 1m body default.
  client_max_body_size 25m;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8115;
    root /srv/www;

    location / {
      try_files $uri /index.html;
    }

    # /api's 300s covers the ~100s interactive LLM budget; /proof's 120s is a
    # generous safety net for what is only ever a local image read.
    location /api/ {
      proxy_pass http://127.0.0.1:8116;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /proof/ {
      proxy_pass http://127.0.0.1:8116;
      proxy_read_timeout 120s;
    }
  }
}
