steps:
  - simple_align:
      cases: true
      top_level_patterns: true
      records: true
  - imports:
      align: group
      list_align: after_alias
      pad_module_names: false
      long_list_align: inline
      empty_list_align: inherit
      list_padding: 2
      separate_lists: true
      space_surround: false
  - language_pragmas:
      style: vertical
      align: false
      remove_redundant: true
  - trailing_whitespace: {}

columns: 80
newline: native

language_extensions:
  - DeriveAnyClass
  - DerivingStrategies
  - DerivingVia
  - GHC2021
  - LambdaCase
  - MultiWayIf
  - OverloadedStrings
  - RecordWildCards
  - ViewPatterns
